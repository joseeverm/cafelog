services:
  db:
    image: postgres:16-alpine
    container_name: cafelog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafelog
      POSTGRES_PASSWORD: cafelog
      POSTGRES_DB: cafelog
    ports:
      - "5432:5432"
    volumes:
      - cafelog_pgdata:/var/lib/postgresql/data

volumes:
  cafelog_pgdata:
